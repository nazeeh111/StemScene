name: Correctness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install CPU PyTorch
        run: python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Run installed CLI and correctness tests
        run: |
          stemscene --version
          python -m pytest -q -p no:cacheprovider
      - name: Check Python sources compile
        run: python -m compileall -q src/stemscene scripts examples
