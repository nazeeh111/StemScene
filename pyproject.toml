[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "stemscene"
version = "0.1.0b1"
description = "Persistent local estimated sound layers and reproducible selective audio edits"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
dependencies = [
  "numpy==1.26.4", "scipy==1.17.1", "soundfile==0.13.1",
  "torch==2.6.0", "transformers==4.44.2", "tokenizers==0.19.1",
  "safetensors==0.8.0", "huggingface-hub==0.34.4"
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
fuss = ["tensorflow==2.18.1"]

[project.scripts]
stemscene = "stemscene.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stemscene"]

[tool.hatch.build.targets.sdist]
exclude = ["/BUILD_BRIEF.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

